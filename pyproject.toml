[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psrdex"
version = "0.1.0"
description = "Incremental pulsar archive metadata pipeline and Streamlit browser"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "astropy>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "plotly>=5.20",
    "psrqpy>=1.3",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
psrdex-update = "psrdex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
